version: v1.3.1
dsn: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${ORY_KRATOS_DB}?sslmode=disable
serve:
  public:
    base_url: http://kratos:4433/
  admin:
    base_url: http://kratos:4434/
selfservice:
  default_browser_return_url: http://invalid.local/
  methods:
    password:
      enabled: true
  flows:

    error:
      ui_url: http://invalid.local/error
    settings:
      ui_url: http://invalid.local/settings
    recovery:
      enabled: false
    verification:
      enabled: true
      use: code
    logout:
      after:
        default_browser_return_url: http://invalid.local/
courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
    from_address: no-reply@uber-clone.local
    from_name: Uber Clone

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json
