name: Temporary PR74 dashboard snap diagnostic

on:
  push:
    branches:
      - fix/drawer-detail-back-flow

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Show formatting diff
        working-directory: mobile
        run: |
          dart format lib test
          git diff --exit-code -- lib test
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test dashboard animation
        working-directory: mobile
        run: flutter test test/dashboard_panel_build_efficiency_test.dart
