name: Driver route validation
on:
  push:
    branches: [fix/driver-trip-route-polylines]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format diagnostics
        run: |
          for path in backend/internal/httpapi/driver_route_preview.go backend/internal/httpapi/driver_route_preview_test.go backend/internal/httpapi/routes.go; do
            if [ -f "$path" ]; then
              gofmt -w "$path"
              echo "FORMAT_BEGIN $path"
              cat "$path"
              echo "FORMAT_END $path"
            fi
          done
      - run: go test ./internal/httpapi -run TestDriverRoute -count=1
        working-directory: backend
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
        working-directory: mobile
      - name: Format diagnostics
        run: |
          for path in mobile/test/driver_route_map_test.dart mobile/lib/features/driver_workspace/data/driver_route_repository.dart mobile/lib/features/driver_workspace/application/driver_route_controller.dart mobile/lib/features/driver_workspace/presentation/driver_workspace_screen.dart mobile/lib/core/providers.dart; do
            if [ -f "$path" ]; then
              dart format "$path"
              echo "FORMAT_BEGIN $path"
              cat "$path"
              echo "FORMAT_END $path"
            fi
          done
      - run: flutter test test/driver_route_map_test.dart
        working-directory: mobile
