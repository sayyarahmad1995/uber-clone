name: Temporary PR74 collapse handoff validation

on:
  push:
    branches:
      - fix/drawer-detail-back-flow

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Preserve scroll mode during collapse body drag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          scaffold = Path('mobile/lib/core/dashboard/ride_dashboard_scaffold.dart')
          text = scaffold.read_text()
          old = '''                                  child: _panelContentFor(
                                    _committedExpanded &&
                                        _expansionSettled &&
                                        !_isDraggingPanel,
                                  ),'''
          new = '''                                  child: _panelContentFor(
                                    _committedExpanded &&
                                        _expansionSettled &&
                                        (!_isDraggingPanel ||
                                            _contentDragStartedAtTop),
                                  ),'''
          if old not in text:
              raise SystemExit('scaffold target not found')
          scaffold.write_text(text.replace(old, new, 1))

          test = Path('mobile/test/dashboard_panel_build_efficiency_test.dart')
          text = test.read_text()
          marker = '\n}\n'
          if not text.endswith(marker):
              raise SystemExit('test file ending not found')
          addition = textwrap.dedent(r'''

            testWidgets('expanded body drag keeps scroll mode stable while collapsing', (
              tester,
            ) async {
              var panelBuilds = 0;

              await tester.pumpWidget(
                MaterialApp(
                  home: RideDashboardScaffold(
                    panelIdentity: 'collapse-handoff',
                    minPanelSize: 0.20,
                    initialPanelSize: 0.60,
                    maxPanelSize: 0.60,
                    map: const ColoredBox(color: Colors.blueGrey),
                    panelBuilder: (context, scrollController, scrollEnabled) {
                      panelBuilds++;
                      return ListView(
                        key: const Key('collapseHandoffList'),
                        controller: scrollController,
                        physics: scrollEnabled
                            ? const ClampingScrollPhysics()
                            : const NeverScrollableScrollPhysics(),
                        children: const [SizedBox(height: 600)],
                      );
                    },
                  ),
                ),
              );
              await tester.pumpAndSettle();

              final panel = find.byKey(const Key('dashboardPanel'));
              final list = find.byKey(const Key('collapseHandoffList'));
              final dashboardHeight = tester
                  .getSize(find.byType(RideDashboardScaffold))
                  .height;
              final buildsBeforeDrag = panelBuilds;

              expect(
                tester.widget<ListView>(list).physics,
                isA<ClampingScrollPhysics>(),
              );

              final drag = await tester.startGesture(tester.getCenter(list));
              await drag.moveBy(const Offset(0, 60));
              await tester.pump();

              final previewHeight = tester.getSize(panel).height;
              expect(previewHeight, lessThan(dashboardHeight * 0.60));
              expect(previewHeight, greaterThan(dashboardHeight * 0.20));
              expect(
                tester.widget<ListView>(list).physics,
                isA<ClampingScrollPhysics>(),
              );
              expect(panelBuilds, buildsBeforeDrag);

              await drag.up();
              await tester.pump();
              expect(
                tester.widget<ListView>(list).physics,
                isA<NeverScrollableScrollPhysics>(),
              );

              await tester.pumpAndSettle();
              expect(
                tester.getSize(panel).height,
                moreOrLessEquals(dashboardHeight * 0.20),
              );
              expect(
                tester.widget<ListView>(list).physics,
                isA<NeverScrollableScrollPhysics>(),
              );
            });
          ''')
          test.write_text(text[:-len(marker)] + addition + marker)
          PY
      - name: Format
        working-directory: mobile
        run: dart format lib/core/dashboard/ride_dashboard_scaffold.dart test/dashboard_panel_build_efficiency_test.dart
      - name: Check formatting
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Focused dashboard tests
        working-directory: mobile
        run: flutter test test/dashboard_panel_build_efficiency_test.dart test/app_routing_test.dart
      - name: Full tests
        working-directory: mobile
        run: flutter test
      - name: Commit fix and remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/temp-pr74-collapse-handoff.yml
          git config user.name "Sayyar Ahmad"
          git config user.email "m.sayyarahmad1995@gmail.com"
          git add mobile/lib/core/dashboard/ride_dashboard_scaffold.dart mobile/test/dashboard_panel_build_efficiency_test.dart .github/workflows/temp-pr74-collapse-handoff.yml
          git commit -m "Keep collapse drag scroll ownership stable"
          git push origin HEAD:fix/drawer-detail-back-flow
