name: Read-only fare regression
on: push
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: uber_clone_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d uber_clone_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go test ./internal/httpapi -run TestReadOnlySuggestedFareHTTP -count=1
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/uber_clone_test?sslmode=disable
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
        working-directory: mobile
      - run: flutter test test/rider_request_submission_test.dart
        working-directory: mobile
