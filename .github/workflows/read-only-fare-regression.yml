name: Read-only fare regression
on: push
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: uber_clone_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d uber_clone_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: |
          gofmt -w internal/httpapi/ride.go internal/httpapi/priced_booking_test.go
          python3 -c 'import pathlib,base64; [print("FORMATTED_FILE", str(p), base64.b64encode(p.read_bytes()).decode()) for p in [pathlib.Path("internal/httpapi/ride.go"),pathlib.Path("internal/httpapi/priced_booking_test.go")]]'
          go test ./internal/httpapi -count=1
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/uber_clone_test?sslmode=disable
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
        working-directory: mobile
      - run: |
          dart format lib/features/rider_request test/rider_request_submission_test.dart test/rider_fare_controller_test.dart test/ride_request_repository_test.dart test/test_doubles.dart
          python3 -c 'import subprocess,pathlib,base64; [print("FORMATTED_FILE", str(p), base64.b64encode(p.read_bytes()).decode()) for p in [pathlib.Path("..") / s for s in subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()] if p.is_file()]'
          flutter test test/rider_request_submission_test.dart test/rider_fare_controller_test.dart test/ride_request_repository_test.dart
        working-directory: mobile
