name: Temporary PR74 dashboard restore

on:
  push:
    branches:
      - fix/drawer-detail-back-flow

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Restore dashboard files from main
        run: |
          git fetch origin main
          git checkout origin/main -- \
            mobile/lib/core/dashboard/ride_dashboard_scaffold.dart \
            mobile/test/app_routing_test.dart \
            mobile/test/dashboard_panel_build_efficiency_test.dart
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Check formatting
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Full tests
        working-directory: mobile
        run: flutter test
      - name: Commit restore and remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/temp-pr74-restore-dashboard.yml
          git config user.name "Sayyar Ahmad"
          git config user.email "m.sayyarahmad1995@gmail.com"
          git add \
            mobile/lib/core/dashboard/ride_dashboard_scaffold.dart \
            mobile/test/app_routing_test.dart \
            mobile/test/dashboard_panel_build_efficiency_test.dart \
            .github/workflows/temp-pr74-restore-dashboard.yml
          git commit -m "Restore dashboard behavior from main"
          git push origin HEAD:fix/drawer-detail-back-flow
