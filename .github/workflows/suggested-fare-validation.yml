name: Suggested fare validation
on:
  push:
    branches: [feat/suggested-fare-rebuild]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: uber_clone_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/uber_clone_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format diagnostics
        run: |
          git diff --name-only 88c3be9fd658b5bc05e569872cfc9bba4267cd89 HEAD -- '*.go' | while read -r path; do
            gofmt -w "$path"
            echo "FORMAT_BEGIN $path"
            cat "$path"
            echo "FORMAT_END $path"
          done
      - run: go test -p 1 ./internal/pricing ./internal/ride ./internal/httpapi ./internal/rideservice ./internal/marketplace ./cmd/api -count=1
        working-directory: backend
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
        working-directory: mobile
      - name: Format diagnostics
        run: |
          git diff --name-only 88c3be9fd658b5bc05e569872cfc9bba4267cd89 HEAD -- '*.dart' | while read -r path; do
            dart format "$path"
            echo "FORMAT_BEGIN $path"
            cat "$path"
            echo "FORMAT_END $path"
          done
      - run: flutter test test/rider_fare_controller_test.dart test/rider_request_submission_test.dart test/rider_route_preview_test.dart test/ride_request_repository_test.dart test/rider_service_catalog_test.dart
        working-directory: mobile
