name: Temporary panel drag optimization

on:
  push:
    branches:
      - feature/capability-drawer-shell

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/capability-drawer-shell
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - name: Apply scaffold optimization
        shell: python
        run: |
          from pathlib import Path

          path = Path('mobile/lib/core/dashboard/ride_dashboard_scaffold.dart')
          source = path.read_text()

          source = source.replace(
              '  double _expandPullDistance = 0;\n\n  static const _collapsePullThreshold = 56.0;',
              '  double _expandPullDistance = 0;\n  Widget? _cachedPanelContent;\n  bool? _cachedPanelScrollEnabled;\n\n  static const _collapsePullThreshold = 56.0;',
          )
          source = source.replace(
              '  void didUpdateWidget(covariant RideDashboardScaffold oldWidget) {\n    super.didUpdateWidget(oldWidget);',
              '  void didUpdateWidget(covariant RideDashboardScaffold oldWidget) {\n    super.didUpdateWidget(oldWidget);\n    _invalidatePanelContent();',
          )
          source = source.replace(
              "                                  child: widget.panelBuilder(\n                                    context,\n                                    _contentScrollController,\n                                    _committedExpanded &&\n                                        _expansionSettled &&\n                                        !_isDraggingPanel,\n                                  ),",
              "                                  child: _panelContentFor(\n                                    _committedExpanded &&\n                                        _expansionSettled &&\n                                        !_isDraggingPanel,\n                                  ),",
          )
          marker = '  void _resizePanel(double verticalDelta, double dashboardHeight) {'
          methods = '''  Widget _panelContentFor(bool scrollEnabled) {\n    if (_cachedPanelContent == null ||\n        _cachedPanelScrollEnabled != scrollEnabled) {\n      _cachedPanelScrollEnabled = scrollEnabled;\n      _cachedPanelContent = _DashboardPanelContent(\n        builder: widget.panelBuilder,\n        scrollController: _contentScrollController,\n        scrollEnabled: scrollEnabled,\n      );\n    }\n    return _cachedPanelContent!;\n  }\n\n  void _invalidatePanelContent() {\n    _cachedPanelContent = null;\n    _cachedPanelScrollEnabled = null;\n  }\n\n'''
          source = source.replace(marker, methods + marker)
          class_marker = '/// Marks interactive content whose pointers must never resize the dashboard.'
          host = '''class _DashboardPanelContent extends StatelessWidget {\n  const _DashboardPanelContent({\n    required this.builder,\n    required this.scrollController,\n    required this.scrollEnabled,\n  });\n\n  final DashboardPanelBuilder builder;\n  final ScrollController scrollController;\n  final bool scrollEnabled;\n\n  @override\n  Widget build(BuildContext context) =>\n      builder(context, scrollController, scrollEnabled);\n}\n\n'''
          source = source.replace(class_marker, host + class_marker)

          path.write_text(source)
      - name: Format scaffold
        run: dart format mobile/lib/core/dashboard/ride_dashboard_scaffold.dart
      - name: Commit optimization
        run: |
          if git diff --quiet -- mobile/lib/core/dashboard/ride_dashboard_scaffold.dart; then
            echo "No scaffold diff produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/core/dashboard/ride_dashboard_scaffold.dart
          git commit -m "perf: avoid rebuilding panel content during drag frames"
          git push origin HEAD:feature/capability-drawer-shell
