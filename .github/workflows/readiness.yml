name: Readiness validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: uber_clone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d uber_clone_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check changed Go file formatting
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          changed_files() {
            if [ -n "${GITHUB_BASE_REF:-}" ]; then
              git fetch --no-tags origin "$GITHUB_BASE_REF"
              git diff --name-only --diff-filter=ACMR "origin/$GITHUB_BASE_REF"...HEAD -- 'backend/**/*.go'
            elif [ -n "${EVENT_BEFORE:-}" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only --diff-filter=ACMR "$EVENT_BEFORE" HEAD -- 'backend/**/*.go'
            else
              git diff-tree --no-commit-id --name-only -r HEAD --diff-filter=ACMR -- 'backend/**/*.go'
            fi
          }

          mapfile -t files < <(changed_files)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Go files changed."
            exit 0
          fi

          unformatted="$(gofmt -l "${files[@]}")"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Guard HTTP database boundary
        run: |
          if grep -R -n -E 'api\.db|DB[[:space:]]*\*sql\.DB' backend/internal/httpapi; then
            echo "httpapi must not access database directly"
            exit 1
          fi
      - run: go vet ./...
        working-directory: backend
      - run: go test -p 1 ./...
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/uber_clone_test?sslmode=disable
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
        working-directory: mobile
      - name: Check changed Dart file formatting
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          changed_files() {
            if [ -n "${GITHUB_BASE_REF:-}" ]; then
              git fetch --no-tags origin "$GITHUB_BASE_REF"
              git diff --name-only --diff-filter=ACMR "origin/$GITHUB_BASE_REF"...HEAD -- 'mobile/lib/**/*.dart' 'mobile/test/**/*.dart'
            elif [ -n "${EVENT_BEFORE:-}" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only --diff-filter=ACMR "$EVENT_BEFORE" HEAD -- 'mobile/lib/**/*.dart' 'mobile/test/**/*.dart'
            else
              git diff-tree --no-commit-id --name-only -r HEAD --diff-filter=ACMR -- 'mobile/lib/**/*.dart' 'mobile/test/**/*.dart'
            fi
          }

          mapfile -t files < <(changed_files)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Dart files changed."
            exit 0
          fi

          dart format --output=none --set-exit-if-changed "${files[@]}"
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: mobile
      - run: git diff --exit-code --ignore-space-at-eol
      - name: Guard retired mobile contracts
        run: |
          if rg -n --glob '*.dart' 'repo\.onboard\(|DriverController\.onboard|Future<DriverProfile> onboard\(' mobile/lib; then
            echo "legacy direct Driver onboarding method found in production Dart"
            exit 1
          fi

          if rg -n -U --glob '*.dart' "/v1/driver['\"]?\s*,\s*data:" mobile/lib/features/driver_workspace; then
            echo "legacy direct Driver onboarding write found in production Dart"
            exit 1
          fi

          if rg -n -U --glob '*.dart' "(?:trip\.)?status\s*==\s*['\"]settled['\"]" mobile/lib/features/rider_request mobile/lib/features/ride_flow; then
            echo "retired settled Trip status found in production Dart"
            exit 1
          fi

          if rg -n --glob '*.dart' 'RideFlowController' mobile/lib/features/ride_flow mobile/lib/features/rider_request; then
            echo "monolithic RideFlowController found"
            exit 1
          fi
      - run: flutter analyze
        working-directory: mobile
      - name: Verify semantic ride-flow repository adapter
        run: flutter test test/ride_flow_repository_test.dart
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
