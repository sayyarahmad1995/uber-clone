name: Temporary map control transform

on:
  push:
    branches:
      - feature/capability-drawer-shell

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/capability-drawer-shell
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - name: Apply paint-only map control follower
        shell: python
        run: |
          from pathlib import Path

          path = Path('mobile/lib/core/dashboard/ride_dashboard_scaffold.dart')
          source = path.read_text()

          source = source.replace(
              "        final controlBottom =\n            constraints.maxHeight * _panelSize + AppSpacing.lg;\n        final transitionDuration = _isDraggingPanel",
              "        final panelHeight = constraints.maxHeight * _panelSize;\n        final transitionDuration = _isDraggingPanel",
          )

          old = '''            if (widget.mapControls != null)\n              AnimatedPositioned(\n                right: AppSpacing.md,\n                bottom: controlBottom,\n                duration: transitionDuration,\n                curve: Curves.easeOutCubic,\n                child: SafeArea(\n                  top: false,\n                  child: RepaintBoundary(child: widget.mapControls!),\n                ),\n              ),'''
          new = '''            if (widget.mapControls != null)\n              Positioned(\n                right: AppSpacing.md,\n                bottom: AppSpacing.lg,\n                child: TweenAnimationBuilder<double>(\n                  tween: Tween<double>(end: panelHeight),\n                  duration: transitionDuration,\n                  curve: Curves.easeOutCubic,\n                  builder: (context, panelOffset, child) => Transform.translate(\n                    offset: Offset(0, -panelOffset),\n                    child: child,\n                  ),\n                  child: SafeArea(\n                    top: false,\n                    child: RepaintBoundary(child: widget.mapControls!),\n                  ),\n                ),\n              ),'''
          if old not in source:
              raise SystemExit('map control block not found')
          source = source.replace(old, new)
          source = source.replace(
              '              height: constraints.maxHeight * _panelSize,',
              '              height: panelHeight,',
          )

          path.write_text(source)
      - name: Format scaffold
        run: dart format mobile/lib/core/dashboard/ride_dashboard_scaffold.dart
      - name: Commit optimization
        run: |
          if git diff --quiet -- mobile/lib/core/dashboard/ride_dashboard_scaffold.dart; then
            echo "No scaffold diff produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/core/dashboard/ride_dashboard_scaffold.dart
          git commit -m "perf: move map control follower with paint transform"
          git push origin HEAD:feature/capability-drawer-shell
