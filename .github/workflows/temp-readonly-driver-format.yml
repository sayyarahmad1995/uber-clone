name: Temporary read-only Driver formatting

on:
  push:
    branches:
      - feature/driver-readonly-surfaces

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/driver-readonly-surfaces
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Apply canonical formatting
        working-directory: mobile
        run: dart format lib/features/driver_workspace/presentation/driver_readonly_surfaces.dart test/driver_readonly_surfaces_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet -- mobile/lib/features/driver_workspace/presentation/driver_readonly_surfaces.dart mobile/test/driver_readonly_surfaces_test.dart; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/features/driver_workspace/presentation/driver_readonly_surfaces.dart mobile/test/driver_readonly_surfaces_test.dart
          git commit -m "style: format Driver read-only surfaces"
          git push origin HEAD:feature/driver-readonly-surfaces
