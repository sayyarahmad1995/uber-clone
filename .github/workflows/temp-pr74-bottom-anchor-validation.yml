name: Temporary PR74 bottom anchor validation

on:
  push:
    branches:
      - fix/drawer-detail-back-flow

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Check formatting
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Focused dashboard tests
        working-directory: mobile
        run: flutter test test/dashboard_panel_build_efficiency_test.dart test/dashboard_panel_session_shell_efficiency_test.dart
      - name: Full tests
        working-directory: mobile
        run: flutter test
