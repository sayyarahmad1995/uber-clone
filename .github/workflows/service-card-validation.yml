name: Service card validation
on:
  push:
    branches: [feat/rider-service-cards]
permissions:
  contents: read
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
        working-directory: mobile
      - name: Format changed card flow files
        run: |
          for file in mobile/test/rider_service_cards_flow_test.dart mobile/test/rider_request_submission_test.dart mobile/test/rider_service_catalog_test.dart mobile/test/app_routing_test.dart mobile/lib/features/rider_request/presentation/rider_service_cards.dart mobile/lib/features/rider_request/presentation/rider_request_screen.dart mobile/lib/features/ride_flow/ride_flow_panels.dart; do
            if [ -f "$file" ]; then
              echo "FORMAT_BEGIN $file"
              dart format --output=show "$file"
              echo "FORMAT_END $file"
            fi
          done
      - name: Test service-first dashboard
        run: flutter test test/rider_service_cards_flow_test.dart
        working-directory: mobile
