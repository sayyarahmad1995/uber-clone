name: Temporary PR74 simplified dashboard validation

on:
  push:
    branches:
      - fix/drawer-detail-back-flow

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Print formatter diff
        working-directory: mobile
        run: |
          dart format test/app_routing_test.dart
          git diff -- test/app_routing_test.dart
          exit 1
