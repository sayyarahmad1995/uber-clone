name: Temporary PR74 simplified dashboard validation

on:
  push:
    branches:
      - fix/drawer-detail-back-flow

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Apply canonical formatting
        working-directory: mobile
        run: dart format test/app_routing_test.dart
      - name: Check formatting
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Direct-drag regression
        working-directory: mobile
        run: flutter test test/dashboard_panel_build_efficiency_test.dart
      - name: Full tests
        working-directory: mobile
        run: flutter test
      - name: Commit formatted test and remove temporary workflow
        run: |
          rm .github/workflows/temp-pr74-simplified-dashboard-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/test/app_routing_test.dart .github/workflows/temp-pr74-simplified-dashboard-validation.yml
          git commit -m "Finalize simplified dashboard drag behavior"
          git push origin HEAD:fix/drawer-detail-back-flow
