name: Temporary Dart format capture

on:
  push:
    branches:
      - feature/capability-drawer-shell

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - name: Capture canonical formatter output
        run: |
          dart format mobile/test/app_routing_test.dart
          git diff -- mobile/test/app_routing_test.dart > /tmp/app-routing-format.patch
          cat /tmp/app-routing-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: app-routing-format
          path: /tmp/app-routing-format.patch
