services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_PORT: ${APP_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-uber_clone}:${POSTGRES_PASSWORD:-uber_clone_local}@postgres:5432/${POSTGRES_DB:-uber_clone}?sslmode=disable
      KRATOS_PUBLIC_URL: http://kratos:4433
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kratos:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uber_clone}
      POSTGRES_USER: ${POSTGRES_USER:-uber_clone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uber_clone_local}
    # Database stays on the internal Compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    environment:
      DSN: postgres://${POSTGRES_USER:-uber_clone}:${POSTGRES_PASSWORD:-uber_clone_local}@postgres:5432/${ORY_KRATOS_DB:-ory_kratos}?sslmode=disable
      POSTGRES_USER: ${POSTGRES_USER:-uber_clone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uber_clone_local}
      ORY_KRATOS_DB: ${ORY_KRATOS_DB:-ory_kratos}
    volumes:
      - ./identity/kratos:/etc/config/kratos:ro
    command: ["migrate", "sql", "-e", "--yes", "-c", "/etc/config/kratos/kratos.yml"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kratos:
    image: oryd/kratos:v1.3.1
    environment:
      DSN: postgres://${POSTGRES_USER:-uber_clone}:${POSTGRES_PASSWORD:-uber_clone_local}@postgres:5432/${ORY_KRATOS_DB:-ory_kratos}?sslmode=disable
    volumes:
      - ./identity/kratos:/etc/config/kratos:ro
    command: ["serve", "-c", "/etc/config/kratos/kratos.yml", "--dev"]
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
